server {
    listen 80;
    listen [::]:80;
    server_name inveontechnologies.in www.inveontechnologies.in;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inveontechnologies.in www.inveontechnologies.in;
    ssl_certificate     /etc/letsencrypt/live/inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt { access_log off; }
    location = /favicon.svg { access_log off; }
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.inveontechnologies.in;
    resolver 127.0.0.11 valid=10s;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/portal.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 15M;

    location /api/ {
        set $portal_backend_upstream portal_backend:4000;
        proxy_pass http://$portal_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $portal_frontend_upstream portal_frontend:3000;
        proxy_pass http://$portal_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

