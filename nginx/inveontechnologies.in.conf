server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/crm.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 15M;

    location /socket.io/ {
        set $crm_backend_upstream crm_backend:5000;
        proxy_pass http://$crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /api/ {
        set $crm_backend_upstream crm_backend:5000;
        proxy_pass http://$crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        set $crm_backend_upstream crm_backend:5000;
        proxy_pass http://$crm_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name events.inveontechnologies.in;
    resolver 127.0.0.11 valid=10s;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name events.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/events.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 15M;

    # Backend API — proxied to events-api. Port 3000 inferred from that
    # service's own healthcheck (http://localhost:3000/health) in its
    # source docker-compose.yml — confirm this matches apps/api's actual
    # listen port before relying on it.
    location /api/ {
        set $events_api_upstream events_api:3000;
        proxy_pass http://$events_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static frontend — written into events-web-static by the one-shot
    # events-web container (see docker-compose.yml), served directly by
    # this nginx rather than proxied. try_files supports client-side
    # routing (React Router/wouter-style SPA).
    location / {
        root /usr/share/nginx/events;
        try_files $uri $uri/ /index.html;
    }
}
