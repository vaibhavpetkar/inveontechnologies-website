# --- Real client IP behind Cloudflare ------------------------------------
# When Cloudflare proxies a request, nginx's $remote_addr is a Cloudflare edge
# IP. Without this, every visitor looks like the same handful of addresses to
# the portal backend, so its per-IP login rate limit (10 tries / 15 min) is
# shared by everyone behind the same edge. These directives replace
# $remote_addr with CF-Connecting-IP — but ONLY for requests that really come
# from Cloudflare, so the header can't be spoofed by direct visitors. Harmless
# if Cloudflare isn't in front. Ranges from https://www.cloudflare.com/ips/
# (refresh occasionally).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name inveontechnologies.in www.inveontechnologies.in;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inveontechnologies.in www.inveontechnologies.in;
    ssl_certificate     /etc/letsencrypt/live/inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt { access_log off; }
    location = /favicon.svg { access_log off; }
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.inveontechnologies.in;
    resolver 127.0.0.11 valid=10s;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/portal.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 15M;

    location /api/ {
        set $portal_backend_upstream portal_backend:4000;
        proxy_pass http://$portal_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $portal_frontend_upstream portal_frontend:3000;
        proxy_pass http://$portal_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

