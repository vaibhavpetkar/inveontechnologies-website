    listen [::]:443 ssl;
    http2 on;
    server_name api.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/crm.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.inveontechnologies.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 15M;

    location /socket.io/ {
        set $crm_backend_upstream crm_backend:5000;
        proxy_pass http://$crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /api/ {
        set $crm_backend_upstream crm_backend:5000;
        proxy_pass http://$crm_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        set $crm_backend_upstream crm_backend:5000;
        proxy_pass http://$crm_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
