# Included in every HTTPS server block (and in any location that sets its own
# add_header, since nginx then drops the inherited ones).
# Login pages that other sites can frame, sniff or downgrade are what Google
# Safe Browsing and Chrome's phishing checks look for, so every subdomain
# sends these.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
