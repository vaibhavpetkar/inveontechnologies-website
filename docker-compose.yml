services:
  web:
    build: .
    container_name: inveontechnologies-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # Events' static frontend build lands here (written by the
      # one-shot events-web container below) and is served directly by
      # this nginx — see the events.inveontechnologies.in server block.
      - events-web-static:/usr/share/nginx/events:ro
    depends_on:
      - certbot
    networks:
      - default
      - crm_network
  certbot:
    image: certbot/certbot:latest
    container_name: inveontechnologies-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
  portal-postgres:
    image: postgres:16-alpine
    container_name: portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:?Set PORTAL_POSTGRES_PASSWORD in your server .env}
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    networks:
      - portal_internal
    # No published ports — only portal-backend (same network) can reach it.
  portal-frontend:
    build: ./portal-frontend
    container_name: portal_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - crm_network
    # No published ports — reached only via the shared nginx reverse proxy
    # over crm_crm_network, same as crm_frontend.
  portal-backend:
    build: ./portal-backend
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      - portal-postgres
    env_file:
      - ./portal-backend/.env
    environment:
      NODE_ENV: production
      PORTAL_PORT: 4000
    networks:
      - crm_network
      - portal_internal
    # Reached only via the shared nginx reverse proxy (crm_network) for
    # HTTP, and reaches portal-postgres over portal_internal — no ports
    # published to the host on either side. Provide ./portal-backend/.env
    # on the server (see portal-backend/.env.example); it is git-ignored.
    # PORTAL_DATABASE_URL in that file should point at
    # postgres://portal:<same password as above>@portal_postgres:5432/portal

  # --- Events app (github.com/inveon-technologies/events, deployed from
  #     /var/www/Events) --- integrated here rather than run as its own
  #     standalone compose stack, because its own docker-compose.yml
  #     defines its own nginx bound to host ports 80/443, which collide
  #     with the "web" service above that already owns those ports. Only
  #     events-postgres, events-api, and events-web (the one-shot static
  #     build step) are used from that stack; its nginx/certbot services
  #     are NOT run here — this repo's existing "web"/"certbot" already
  #     cover that for every subdomain, events included.
  events-postgres:
    image: postgres:15-alpine
    container_name: events_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: ${EVENTS_POSTGRES_PASSWORD:?Set EVENTS_POSTGRES_PASSWORD in your server .env}
    volumes:
      - events-postgres-data:/var/lib/postgresql/data
    networks:
      - events_internal
    # No published ports — only events-api (same network) can reach it.

  events-redis:
    image: redis:7-alpine
    container_name: events_redis
    restart: unless-stopped
    networks:
      - events_internal
    # No published ports — only events-api (same network) can reach it.
    # Dedicated to Events, not shared with crm_redis — same reasoning as
    # events-postgres being its own service rather than sharing
    # portal-postgres or a CRM database: separate failure domain, no
    # key-namespace collisions, no unrelated app's traffic affecting this
    # one's cache/OTP storage.

  events-api:
    image: ghcr.io/inveon-technologies/events-api:${EVENTS_IMAGE_TAG:-latest}
    container_name: events_api
    restart: unless-stopped
    env_file:
      # Absolute path to the actual Events checkout on the server — this
      # repo and Events are separate git repos, not nested.
      - /var/www/Events/apps/api/.env
    environment:
      NODE_ENV: production
    volumes:
      # Uploaded logos, banners, gallery photos and ticket/certificate
      # artwork (served by the API at /api/uploads/...). Without this they
      # live in the container and are lost every time it is recreated.
      # With S3_BUCKET set in the API's .env, uploads go to S3 instead and
      # this stays empty.
      - events-uploads:/app/uploads
    depends_on:
      - events-postgres
      - events-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - crm_network
      - events_internal
    # Reached only via the shared nginx reverse proxy (crm_network) for
    # HTTP, and reaches events-postgres over events_internal — no ports
    # published to the host on either side. /var/www/Events/apps/api/.env
    # must set the DB connection to point at
    # postgres://events:<EVENTS_POSTGRES_PASSWORD>@events_postgres:5432/events
    # — confirm the exact env var name events-api expects (DATABASE_URL or
    # similar) against apps/api/.env.example in that repo.

  # One-shot: copies the built frontend into events-web-static, then
  # exits (restart: "no" is intentional here, not an oversight).
  events-web:
    image: ghcr.io/inveon-technologies/events-web:${EVENTS_IMAGE_TAG:-latest}
    container_name: events_web_build
    volumes:
      - events-web-static:/usr/share/nginx/html
    restart: "no"

volumes:
  certbot-conf:
  certbot-www:
  portal-postgres-data:
  events-postgres-data:
  events-web-static:
  events-uploads:

networks:
  crm_network:
    external: true
    name: crm_crm_network
  portal_internal:
    driver: bridge
  events_internal:
    driver: bridge
