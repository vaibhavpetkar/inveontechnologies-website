name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    name: Marketing site — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  portal-frontend:
    name: Portal frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  portal-backend:
    name: Portal backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://portal:portal@localhost:5432/portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Fails if schema.ts changed without a matching generated migration.
      - name: Migrations match schema
        run: |
          npx drizzle-kit generate
          git diff --exit-code -- src/migrations || (echo "::error::schema.ts changed without a migration — run npm run db:generate and commit it" && exit 1)
          test -z "$(git status --porcelain -- src/migrations)" || (echo "::error::untracked migration generated — run npm run db:generate and commit it" && exit 1)
      - run: npm test
